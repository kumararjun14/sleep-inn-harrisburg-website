{% extends "base.html" %}
{% block content %}
<section class="page-hero">
<p class="eyebrow" data-reveal>Booking Request</p>
<h1 data-reveal>Tell us what you need.</h1>
</section>
<section class="form-shell glass" data-reveal>
  <p>Portfolio demo: this form does not submit a reservation or store your information.</p>
<form method="post" class="modern-form">
    <label>Name<input name="name" required placeholder="Your name">
</label>
    <label>Email<input type="email" name="email" required placeholder="you@email.com">
</label>
    <label>Phone<input name="phone" placeholder="Best phone number">
</label>
    <div class="two-col">
<label>Check-in<input type="date" name="checkin">
</label>
<label>Check-out<input type="date" name="checkout">
</label>
</div>
    <label>Room Type<select name="room_type">
{% for room in rooms %}
<option value="{{ room.slug }}">{{ room.name }}</option>
{% endfor %}
</select>
</label>
    <label>Message<textarea name="message" rows="5" placeholder="Number of guests, special requests, group blocks, etc.">
</textarea>
</label>
    <button class="button primary" type="submit">Try demo form</button>
  </form>
</section>
{% endblock %}
