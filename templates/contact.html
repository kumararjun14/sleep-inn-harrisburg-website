{% extends "base.html" %}
{% block content %}
<section class="page-hero">
<p class="eyebrow" data-reveal>Location & Contact</p>
<h1 data-reveal>Close to Hershey. Easy from Harrisburg.</h1>
</section>
<section class="contact-grid section">
  <div class="glass contact-card" data-reveal>
    <h2>Contact the hotel</h2>
    <p>Contact information is omitted until verified by the hotel.</p>
<p>{{ hotel.location }}</p>
    <p>Portfolio demo: messages are not sent or stored.</p>
<form method="post" class="modern-form compact">
      <label>Name<input name="name" required>
</label>
      <label>Email<input type="email" name="email" required>
</label>
      <label>Message<textarea name="message" rows="4">
</textarea>
</label>
      <button class="button primary" type="submit">Try demo form</button>
    </form>
  </div>
  <div class="map-card glass" data-reveal>
    <iframe title="Google Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Sleep%20Inn%20%26%20Suites%20Harrisburg%20Hershey%20North&output=embed">
</iframe>
  </div>
</section>
{% endblock %}
